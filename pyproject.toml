[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ratemds-scraper"
version = "0.1.0"
description = "Resumable, Cloudflare-aware scraper for RateMDs doctor profiles and reviews."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Zycheng114514" }]
keywords = ["scraper", "ratemds", "cloudflare", "reviews", "healthcare", "web-scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Bulk HTTP with a browser-grade TLS fingerprint, used once we hold a cookie.
    "curl_cffi>=0.7.0",
    # Cloudflare-challenge solver: the preferred undetected-Chrome driver.
    "nodriver>=0.38",
]

[project.optional-dependencies]
# Fallback browser path, used automatically if nodriver fails to start.
# After installing, run `playwright install chromium`.
playwright = ["playwright>=1.44", "playwright-stealth>=1.0.6"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Zycheng114514/ratemds-scraper"
Repository = "https://github.com/Zycheng114514/ratemds-scraper"
Issues = "https://github.com/Zycheng114514/ratemds-scraper/issues"

[project.scripts]
ratemds-scraper = "ratemds_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ratemds_scraper = ["fleet/scripts/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
